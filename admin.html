<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexiumFilms - Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <script>
        if (sessionStorage.getItem("nexium_admin_auth") !== "1") {
            window.location.replace("login.html");
        }
    </script>
</head>

<body>
<div class="admin-container">

    <div class="admin-header">
        <div>
            <h1>NEXIUM<span>FILMS</span></h1>
            <p class="subtitle">Administration · Films · Séries · Anime</p>
        </div>
        <button id="logoutButton" class="logout-button">SE DÉCONNECTER</button>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="mediaSearch"
            placeholder="Rechercher un film, une série ou un anime…"
            autocomplete="off"
        >

        <select id="mediaType">
            <option value="movie">Films (TMDB)</option>
            <option value="tv">Séries (TMDB)</option>
            <option value="anime">Anime (AniList)</option>
        </select>

        <button id="searchButton">RECHERCHER</button>
    </div>

    <div id="loading"></div>
    <div id="results"></div>

    <hr>

    <h2>Films ajoutés</h2>
    <div id="movieLibrary"></div>

    <hr>

    <h2>Séries ajoutées</h2>
    <div id="seriesLibrary"></div>

    <hr>

    <h2>Anime ajoutés</h2>
    <div id="animeLibrary"></div>

</div>

<script src="admin.js"></script>
</body>
</html>
