<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NexiumFilms - Administration
    </title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

<div class="login-container">


    <div class="login-logo">

        NEXIUM<span>FILMS</span>

    </div>


    <div class="login-card">

        <div class="lock">
            🔐
        </div>


        <h1>
            Administration
        </h1>


        <p>
            Entrez le code d'accès
            pour continuer.
        </p>


        <input
            type="password"
            id="adminCode"
            placeholder="Code d'accès"
            autocomplete="off"
        >


        <button
            id="loginButton"
        >
            ACCÉDER
        </button>


        <p id="error"></p>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
